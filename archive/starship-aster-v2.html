    if(action==='galaxy-jump'){if(!dist){toast('Already in this star system.');return true}if(dist>12+Math.floor(state.power.helm/4)){toast('Out of flux range. Select a nearer intermediate system.',true);return true}if(state.power.helm<12){toast('Engineering must allocate at least 12 Helm units.',true);return true}if(g.fuel<cost){toast('Insufficient fuel. Trade at a market system.',true);return true}g.fuel-=cost;g.q=s.q;g.r=s.r;g.jumps++;g.turn++;g.discovered[s.id]={...(g.discovered[s.id]||{}),visited:true};state.location=s.name+' · '+s.faction.region;state.inOrbit=true;state.speed=0;state.course={x:s.q,y:s.r,z:0,plotted:false};state.plottedDestination=s.name;setContactForSystem(s);if(s.hazard){state.shields.fore=clamp(state.shields.fore-9,0,100);galaxyLog('Ion squall encountered: forward shields reduced by 9%.')}if(s.anomaly)galaxyLog('Uncatalogued anomaly detected in '+s.name+'. Science survey recommended.');galaxyLog('S.V. Aster entered '+s.name+' ('+s.faction.region+'). Jump fuel −'+cost+'.');commit('Flux jump complete. '+s.name+' · '+s.faction.name+'.');return true}

    if(action==='galaxy-hail'){if(dist||!g.contact||g.contact.hull<=0){toast('No nearby vessel to hail.',true);return true}const p=g.contact;g.reputation[p.faction]=clamp((g.reputation[p.faction]||0)+(p.stance==='hostile'?1:3),-100,100);const speech=p.stance==='hostile'?'Our patrol orders are explicit. Withdraw from restricted space.':p.stance==='neutral'?'Identify your cargo and keep weapons secured.':'Safe passage, Aster. Our charts are yours to use.';addComm('INCOMING · '+p.name,speech);galaxyLog(p.name+': '+speech);commit('Incoming transmission from '+p.name+'.');return true}
    if(action==='galaxy-trade'){if(dist||!s.trade){toast('No trading facilities in this sector.',true);return true}if(g.credits<12||g.fuel>=100){toast('Not enough credits or fuel tanks already full.',true);return true}g.credits-=12;g.fuel=clamp(g.fuel+20,0,100);galaxyLog('Bought 20 fuel units at '+s.name+' for 12 credits.');commit('Trade completed. Fuel '+g.fuel+'% · credits '+g.credits+'.');return true}
    return true}
  function addBridgeEncounter(){const screen=document.getElementById('moving-stars');if(!screen)return;const p=state.galaxy.contact;if(!p||p.hull<=0)return;screen.insertAdjacentHTML('beforeend',`<svg x="515" y="125" width="215" height="116" viewBox="0 0 140 76" style="filter:drop-shadow(0 0 8px ${POWER_BY_ID[p.faction]?.colour||'#87bace'}88)">${spaceshipSVG(p.faction).replace('<svg viewBox="0 0 140 76" class="vessel-art" role="img" aria-label="'+esc(POWER_BY_ID[p.faction]?.name||'Unknown')+' starship silhouette">','<g>').replace('</svg>','</g>')}</svg>`)}
  function appendTacticalVisual(){if(activeStation!=='weapons')return;const radar=document.querySelector('.radar-crt');const contact=state.galaxy.contact;if(!radar||!contact||contact.hull<=0)return;const panel=document.createElement('div');panel.className='tactical-vessel';panel.innerHTML=spaceshipSVG(contact.faction,true)+`<span>${esc(contact.name)} · ${esc(contact.stance.toUpperCase())}</span>`;radar.append(panel)}

  RENDERERS.galaxy=galaxy;
  function startStarfield(){
    if(starAnimation!==null){cancelAnimationFrame(starAnimation);starAnimation=null}
    const stars=Array.from(document.querySelectorAll('#moving-stars circle[data-star]'));
    if(!stars.length)return;
    let prev=performance.now();
    function frame(now){
      const elapsed=clamp((now-prev)/1000,0,.05);prev=now;
      const velocity=7+(state.speed*17);
      stars.forEach((star,i)=>{
        let x=Number(star.getAttribute('cx'))-elapsed*velocity*(.5+(i%5)*.25);
        if(x<367)x=833;
        star.setAttribute('cx',x);
      });
      starAnimation=requestAnimationFrame(frame);
    }
    starAnimation=requestAnimationFrame(frame);
  }
  function renderMain(){document.getElementById('main-content').innerHTML=RENDERERS[activeStation]();startStarfield();if(activeStation==='galaxy')bindGalaxyCanvas();if(activeStation==='bridge')addBridgeEncounter();if(activeStation==='weapons')appendTacticalVisual();}
  function updatePowerUI(){if(activeStation!=='engineering')return;POWER_KEYS.forEach(k=>{const inp=document.querySelector(`[data-power-range="${k}"]`),out=document.querySelector(`[data-power-output="${k}"]`),bar=document.querySelector(`[data-alloc-bar="${k}"]`);if(inp)inp.value=state.power[k];if(out)out.textContent=state.power[k]+'%';if(bar)bar.style.width=state.power[k]+'%'});const n=document.getElementById('eng-reserve');if(n)n.textContent=reserve();const o=document.querySelector('.allocation-meter+.orientation');if(o)o.innerHTML=`${totalPower()} UNITS ALLOCATED · <span id="eng-reserve">${reserve()}</span> UNITS FREE`}
  function changePower(key,target){if(!POWER_KEYS.includes(key))return;target=clamp(Math.round(target),0,65);const cur=state.power[key];if(target>cur){let needed=target-cur;const r=Math.min(needed,reserve());state.power[key]+=r;needed-=r;const donors=['science','helm','medical','shields','weapons'].filter(k=>k!==key);for(const donor of donors){if(needed<=0)break;const possible=Math.max(0,state.power[donor]-5);const pulled=Math.min(needed,possible);state.power[donor]-=pulled;state.power[key]+=pulled;needed-=pulled}}else state.power[key]=target;state.decisions++;save();renderHud();updatePowerUI()}
  function addComm(from,text){state.communications.logs.push({from,text,at:stamp()});state.communications.logs=state.communications.logs.slice(-25)}
  function fire(type){if(state.galaxy.contact?.stance==='friendly'&&state.galaxy.contact?.hull>0){toast('Friendly vessel in targeting scope. Weapons locked by standing orders.',true);return}if(!state.armed){toast('Raise the firing safety cover first.',true);return}if(!ready(type)){toast('Weapon unavailable. Check ammunition and Engineering power allocation.',true);return}if(state.enemyHull<=0){toast('No active hostile target.',true);return}
    const damage={phaser:14,photon:28,quantum:48}[type];if(type==='phaser')state.phaserCharge=clamp(state.phaserCharge-30,0,100);else if(type==='photon')state.torpedoes.photon--;else state.torpedoes.quantum--;
    state.enemyHull=clamp(state.enemyHull-damage,0,100);state.threat=clamp(state.threat+11,0,100);if(state.enemyHull>0){const hit=Math.round(3+state.threat/12);const arc=SHIELD_ARCS[Math.floor(Math.random()*SHIELD_ARCS.length)];state.shields[arc]=clamp(state.shields[arc]-hit,0,100);if(shieldValue(arc)<22){state.hull=clamp(state.hull-3,0,100);state.crewHealth=clamp(state.crewHealth-1,0,100)}}else{state.threat=0;state.missionStage='secured';state.alert='yellow'}if(state.galaxy.contact){const c=state.galaxy.contact;if(c.stance!=='hostile'){state.galaxy.reputation[c.faction]=clamp((state.galaxy.reputation[c.faction]||0)-20,-100,100);c.stance='hostile'}c.hull=state.enemyHull;if(!c.hull)galaxyLog(c.name+' disabled in '+currentSystem().name+'.')}commit(`${({phaser:'BEAM',photon:'PULSE',quantum:'NOVA'}[type]||type).toUpperCase()} FIRED — TARGET INTEGRITY ${state.enemyHull}%.${state.enemyHull<=0?' CONTACT DISABLED.':''}`)
  }
  function handleAction(action,button){
    if(handleGalaxyAction(action))return;
    if(action==='warp' && state.course.plotted && chosenSystem() && state.course.x===chosenSystem().q && state.course.y===chosenSystem().r && hexDistance(currentSystem(),chosenSystem())>0){handleGalaxyAction('galaxy-jump');return;}
    if(action==='toggle-hud'){document.body.classList.toggle('hud-open');return}
    if(action==='plot'){const coords={};for(const k of ['x','y','z']){const v=Number(document.getElementById('course-'+k).value);if(!Number.isFinite(v)||Math.abs(v)>999){toast('Coordinates must be between −999 and 999.',true);return}coords[k]=Math.round(v)}state.course={...coords,plotted:true};state.plottedDestination=document.getElementById('nav-destination').value;state.inOrbit=false;commit(`Navigation vector locked for ${state.plottedDestination}.`);return}
    if(action==='warp'){const n=Number(document.getElementById('warp-slider').value);if(!state.course.plotted){toast('Plot and lock a navigation vector first.',true);return}if(state.power.helm<12){toast('Flux engines need at least 12 helm power units.',true);return}if(n<.5){toast('Raise the throttle to engage warp.',true);return}state.speed=n;state.inOrbit=false;state.location=`En route to ${state.plottedDestination}`;if(n>=7)state.shields.fore=clamp(state.shields.fore-6,0,100);commit(`Flux ${n.toFixed(1)} engaged. Destination: ${state.plottedDestination}.`);return}
    if(action==='stop'){state.speed=0;commit('Helm reports: all stop. Impulse systems standing by.');return}
    if(action==='orbit'){if(!state.course.plotted){toast('Plot a course to the orbital destination first.',true);return}state.speed=0;state.inOrbit=true;state.location=`Standard orbit · ${state.plottedDestination}`;commit(`Standard orbit established around ${state.plottedDestination}.`);return}
    if(action==='toggle-arm'){state.armed=!state.armed;commit(state.armed?'Tactical safeties disengaged. Weapons armed.':'Tactical safeties engaged. Weapons secured.');return}
    if(action.startsWith('fire-')){fire(action.slice(5));return}
    if(action==='scan'){if(state.power.science<8){toast('Science sensors require at least 8 power units.',true);return}state.science.scanCount++;state.science.analysis=clamp(state.science.analysis+25,0,100);const f=['Signal origin: abandoned orbital beacon on Nereid IV.','Signal contains a repeating encoded stellar coordinate sequence.','Detected artificial emissions from an unregistered vessel K-17.','Complete scan: the beacon is relaying medical distress telemetry.'];const line=f[Math.min(state.science.scanCount-1,f.length-1)];if(!state.science.findings.includes(line))state.science.findings.push(line);if(state.science.analysis>=50&&state.missionStage==='unidentified')state.missionStage='scanned';commit(`Sensor sweep ${state.science.scanCount} complete. Data confidence ${state.science.analysis}%.`);return}
    if(action==='analyse'){if(state.science.analysis<25){toast('Run a sensor sweep first.',true);return}if(state.science.analysis>=50&&state.missionStage==='unidentified')state.missionStage='scanned';commit(`Scientific report published: ${state.science.analysis}% confidence.`,{notice:true});return}
    if(action==='receive'){const f=state.communications.frequency;const msg=Math.abs(f-142.7)<1?'Beacon 7 to any vessel: medical supplies urgently required. Hostile ship nearby.':Math.abs(f-167.3)<1?'Vessel K-17: Do not approach the beacon. We are tracking your ship.':'No decodable traffic on this frequency. Background subspace static.';addComm('INCOMING · SUBSPACE',msg);commit('New transmission acquired and stored in the message log.');return}
    if(action.startsWith('respond-')){const choice=action.slice(8);if(choice==='calm'){addComm('OUTGOING · S.V. ASTER','We are here to assist. Identify your situation and coordinates.');addComm('INCOMING · BEACON 7','Relief acknowledged. Our medical shelters are overwhelmed. Please dispatch a team.');state.threat=clamp(state.threat-16,0,100);state.missionStage='contacted'}else if(choice==='scan'){addComm('OUTGOING · S.V. ASTER','Transmit your identification and any scientific data.');addComm('INCOMING · BEACON 7','Relaying identification string: B7-204. Coordinates encrypted in repeated stellar pulse.');state.science.analysis=clamp(state.science.analysis+10,0,100);state.missionStage='contacted'}else{addComm('OUTGOING · S.V. ASTER','Unidentified vessel: alter course immediately or face defensive action.');addComm('INCOMING · CONTACT K-17','Threat received. This sector is ours.');state.threat=clamp(state.threat+24,0,100);state.alert='red'}state.communications.lastChoice=choice;commit('Transmission sent. Command report and threat telemetry updated.');return}
    if(['red-alert','yellow-alert','stand-down'].includes(action)){state.alert=action==='red-alert'?'red':action==='yellow-alert'?'yellow':'normal';commit(`Captain orders: ${state.alert==='normal'?'stand down':state.alert.toUpperCase()+' ALERT'}.`);return}
    if(action==='lower-shields'){state.shieldBackup=clone(state.shields);SHIELD_ARCS.forEach(k=>state.shields[k]=8);state.shieldsLowered=true;commit('Shield grid lowered. Transporter now has a clear path.');return}
    if(action==='raise-shields'){if(state.shieldBackup)state.shields=clone(state.shieldBackup);state.shieldsLowered=false;state.shieldBackup=null;commit('Deflector shields restored to their previous strength.');return}
    if(action==='lock'){state.security.locks=true;commit(`Transporter lock authorised for ${state.security.destination}.`);return}
    if(action==='deploy'){if(!state.security.locks){toast('Authorise transporter lock first.',true);return}if(!state.shieldsLowered){toast('Lower the shields before transporting.',true);return}if(state.security.awayTeam){toast('One team is already deployed.',true);return}state.security.awayTeam=state.security.teamSize;state.security.deployments++;state.security.locks=false;state.missionStage='deployed';commit(`${state.security.awayTeam} personnel beamed to ${state.security.destination}.`);return}
    if(action==='recall'){if(!state.shieldsLowered){toast('Lower shields to recover away personnel.',true);return}state.security.awayTeam=0;state.security.locks=false;state.missionStage=state.science.analysis>=50&&['calm','scan'].includes(state.communications.lastChoice)&&state.security.destination===SECURITY_DESTINATIONS[0]?'complete':'recovered';state.crewHealth=clamp(state.crewHealth+1,0,100);commit(state.missionStage==='complete'?'Mission complete! Nereid rescue secured; the away team is safely home.':'Away team safely recovered. Medical checks in progress.');return}
    if(action.startsWith('bias-')){const arc=action.slice(5);if(!SHIELD_ARCS.includes(arc))return;if(state.shieldsLowered){toast('Restore shields before adjusting emitter bias.',true);return}for(const k of SHIELD_ARCS){if(k!==arc)state.shields[k]=clamp(state.shields[k]-7,0,100)}state.shields[arc]=clamp(state.shields[arc]+21,0,100);commit(`Deflector bias transferred towards ${arc.toUpperCase()} shield array.`);return}
    if(action==='preset-explore'){state.power={helm:25,weapons:12,shields:23,science:27,medical:10};commit('Power preset loaded: EXPLORATION.');return}
    if(action==='preset-battle'){state.power={helm:10,weapons:42,shields:35,science:5,medical:5};state.alert='red';commit('Power preset loaded: BATTLE STATIONS.');return}
    if(action==='preset-medical'){state.power={helm:10,weapons:12,shields:20,science:13,medical:40};commit('Power preset loaded: EMERGENCY MEDICAL.');return}
    if(action==='preset-balanced'){state.power=clone(INITIAL.power);commit('Power preset loaded: BALANCED.');return}
    if(action==='repair-hull'){if(state.power.helm<12){toast('Engineering requires at least 12 helm power units for structural repairs.',true);return}if(state.hull===100){toast('Hull integrity is already at maximum.');return}state.hull=clamp(state.hull+12,0,100);commit(`Hull plating restored to ${state.hull}%.`);return}
    if(action==='recharge-shields'){if(state.power.shields<15){toast('Insufficient shield-array power to recharge.',true);return}if(state.shieldsLowered){toast('Raise shields before recharging.',true);return}SHIELD_ARCS.forEach(k=>state.shields[k]=clamp(state.shields[k]+12,0,100));commit('Deflector batteries recharged (+12% to each arc).');return}
    if(action==='diagnostics'){commit(`Crew bioscan complete: ${state.crewInjured} require monitoring. Overall health ${state.crewHealth}%.`);return}
    if(action==='heal'){const i=Number(button.dataset.index),p=state.medical.roster[i];if(!p)return;if(state.power.medical<12){toast('Reroute at least 12 power units to Medical.',true);return}if(state.medical.supplies<=0){toast('Medical supplies exhausted.',true);return}if(p.hp>=100)return;p.hp=clamp(p.hp+25,0,100);state.medical.supplies--;state.crewHealth=clamp(state.crewHealth+3,0,100);state.crewInjured=Math.max(0,state.crewInjured-2);commit(`${p.name} treated successfully. Vital signs now ${p.hp}%.`);return}
    if(action==='mass-triage'){if(state.power.medical<12){toast('Reroute at least 12 power units to Medical first.',true);return}if(state.medical.supplies<2){toast('Mass triage requires two medical kits.',true);return}state.medical.supplies-=2;state.medical.roster.forEach(p=>p.hp=clamp(p.hp+12,0,100));state.crewHealth=clamp(state.crewHealth+5,0,100);state.crewInjured=Math.max(0,state.crewInjured-4);commit('Mass triage complete. Crew health improved across all decks.');return}
  }
  document.addEventListener('keydown',event=>{if(event.key==='Escape')document.body.classList.remove('hud-open')});
  document.addEventListener('click',event=>{
    const nav=event.target.closest('[data-nav]');if(nav){setStation(nav.dataset.nav);return}
    const action=event.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action);return}
  });
  document.addEventListener('input',event=>{
    const t=event.target;
    if(t.dataset.powerRange){changePower(t.dataset.powerRange,Number(t.value));return}
    if(t.id==='warp-slider'){const out=document.getElementById('warp-readout');if(out)out.textContent=Number(t.value).toFixed(1)}
    if(t.id==='frequency-slider'){const val=document.getElementById('frequency-value');if(val)val.textContent=Number(t.value).toFixed(1)+' MHz';state.communications.frequency=Number(t.value);save()}
    if(t.id==='team-slider'){const val=document.getElementById('team-count');if(val)val.textContent=t.value+' CREW';state.security.teamSize=Number(t.value);save()}
  });
  document.addEventListener('change',event=>{
    if(event.target.dataset.powerRange){const key=event.target.dataset.powerRange;log(`${POWER_LABELS[key]} allocation changed to ${state.power[key]} units.`);save();renderMain();toast('Ship power distribution updated across all stations.');}
    if(event.target.id==='security-destination'){state.security.destination=event.target.value;state.security.locks=false;save()}
  });
  document.getElementById('reset-button').addEventListener('click',()=>{
    if(!confirm('Restart the Aster expedition? This resets ship status and ALL discovered star systems on this device.'))return;
    Object.keys(state).forEach(key=>delete state[key]);Object.assign(state,clone(INITIAL));state.galaxy=clone(startGalaxy);state.location='Earth orbit · Sol system';state.inOrbit=true;save();activeStation='bridge';renderHeader();renderHud();renderMain();toast('S.V. Aster has returned to Earth orbit. New expedition initiated.');
  });
  // Low-cost reactor tick: weapon charge restores gradually if enough power is allocated.
  // Renders telemetry only, preserving keyboard focus, range-slider drag, and typed input.
  setInterval(()=>{
    if(state.phaserCharge<100&&state.power.weapons>=12){state.phaserCharge=clamp(state.phaserCharge+3,0,100);save();renderHud();if(activeStation==='weapons'){const label=document.querySelector('.data-pair:nth-child(2) strong');if(label)label.textContent=state.phaserCharge+'%';}}
  },3500);
  setInterval(()=>{if(activeStation==='galaxy'&&!galaxyView.drag)drawGalaxy()},2800);
  renderHeader();renderHud();renderMain();
})();
