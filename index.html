  function shipSchematic(){return `<div class="metal-panel schematic-panel"><svg viewBox="0 0 270 158" role="img" aria-label="AVS Taleryn original crescent delta hull schematic"><defs><pattern id="schemGrid" width="14" height="14" patternUnits="userSpaceOnUse"><path d="M14 0H0V14" fill="none" stroke="#3d675e" stroke-width=".5"/></pattern></defs><rect width="270" height="158" fill="url(#schemGrid)"/><g fill="none" stroke="#93e3c8" stroke-width="2.4"><path d="M135 9 L166 62 L244 117 L210 128 L162 111 L135 145 L108 111 L60 128 L26 117 L104 62Z"/><path d="M135 9V145 M104 62 L135 79 L166 62 M60 128 L98 104 L135 116 L172 104 L210 128"/><path d="M104 62 Q135 54 166 62"/><ellipse cx="135" cy="95" rx="21" ry="30"/><path d="M111 109 L75 140 M159 109 L195 140"/></g><circle cx="135" cy="95" r="9" stroke="#e5d487" stroke-width="2" fill="#274e57"/><g fill="#85c5c7" font-family="monospace" font-size="9"><text x="8" y="14">HULL 01</text><text x="208" y="14">DORSAL</text><text x="8" y="154">PORT</text><text x="223" y="154">STBD</text></g></svg><div class="hull-name">AVS-019 · TRAVERSE CRUISER</div></div>`}

  function fire(type){
    const t=tactical(),contact=state.galaxy.contact;
    if(contact?.stance!=='hostile'){toast('Tactical interlock: do not fire on non-hostile contacts.',true);return;}
    if(!state.armed){toast('Raise the firing safety cover first.',true);return;}
    if(!ready(type)){toast('Weapon unavailable. Check ammunition and Engineering power.',true);return;}
    if(!canFire(type)){toast(`Acquire tracking lock, then close within ${Math.round(WEAPON_RANGE[type]/1000)} Mm range.`,true);return;}
    const damage={phaser:14,photon:28,quantum:48}[type];
    if(!contact.training){
      if(type==='phaser')state.phaserCharge=clamp(state.phaserCharge-30,0,100);
      else if(type==='photon')state.torpedoes.photon--;
      else state.torpedoes.quantum--;
    }
    const glancing=(t.evasive>0&&Math.random()<.3),actual=glancing?Math.ceil(damage*.6):damage;

      commit(`${type.toUpperCase()} HIT · HOSTILE CONTACT DISABLED. Reward recorded.`);
    }else{
      syncContactState();state.threat=clamp(state.threat+4,0,100);

    }
  }

    if(action==='stop'){state.speed=0;commit('Helm reports: all stop. Impulse systems standing by.');return}
    if(action==='orbit'){if(!state.course.plotted){toast('Plot a course to the orbital destination first.',true);return}state.speed=0;state.inOrbit=true;state.location=`Standard orbit · ${state.plottedDestination}`;commit(`Standard orbit established around ${state.plottedDestination}.`);return}
    if(action==='toggle-arm'){state.armed=!state.armed;commit(state.armed?'Tactical safeties disengaged. Weapons armed.':'Tactical safeties engaged. Weapons secured.');return}
    if(action.startsWith('fire-')){fire(action.slice(5));return}
    if(action==='scan'){if(state.power.science<8){toast('Science sensors require at least 8 power units.',true);return}state.science.scanCount++;state.science.analysis=clamp(state.science.analysis+25,0,100);if(state.galaxy){const s=currentSystem();state.galaxy.scans++;state.galaxy.discovered[s.id]={...(state.galaxy.discovered[s.id]||{}),scanned:true};}const f=['Signal origin: abandoned orbital beacon on Telora.','Signal contains a repeating encoded stellar coordinate sequence.','Detected artificial emissions from an unregistered vessel K-17.','Complete scan: the beacon is relaying medical distress telemetry.'];const line=f[Math.min(state.science.scanCount-1,f.length-1)];if(!state.science.findings.includes(line))state.science.findings.push(line);if(state.science.analysis>=50&&state.missionStage==='unidentified')state.missionStage='scanned';commit(`Sensor sweep ${state.science.scanCount} complete. Data confidence ${state.science.analysis}%.`);return}
    if(action==='analyse'){if(state.science.analysis<25){toast('Run a sensor sweep first.',true);return}if(state.science.analysis>=50&&state.missionStage==='unidentified')state.missionStage='scanned';commit(`Scientific report published: ${state.science.analysis}% confidence.`,{notice:true});return}
    if(action==='receive'){const f=state.communications.frequency;const msg=Math.abs(f-142.7)<1?'Relay Seven to any vessel: medical supplies urgently required. Hostile ship nearby.':Math.abs(f-167.3)<1?'Vessel K-17: Do not approach the beacon. We are tracking your ship.':'No decodable traffic on this frequency. Background subspace static.';addComm('INCOMING · SUBSPACE',msg);commit('New transmission acquired and stored in the message log.');return}
    if(action.startsWith('respond-')){const choice=action.slice(8);if(choice==='calm'){addComm('OUTGOING · AVS TALERYN','We are here to assist. Identify your situation and coordinates.');addComm('INCOMING · RELAY SEVEN','Relief acknowledged. Our medical shelters are overwhelmed. Please dispatch a team.');state.threat=clamp(state.threat-16,0,100);state.missionStage='contacted'}else if(choice==='scan'){addComm('OUTGOING · AVS TALERYN','Transmit your identification and any scientific data.');addComm('INCOMING · RELAY SEVEN','Relaying identification string: B7-204. Coordinates encrypted in repeated stellar pulse.');state.science.analysis=clamp(state.science.analysis+10,0,100);state.missionStage='contacted'}else{addComm('OUTGOING · AVS TALERYN','Unidentified vessel: alter course immediately or face defensive action.');addComm('INCOMING · CONTACT K-17','Threat received. This sector is ours.');state.threat=clamp(state.threat+24,0,100);state.alert='red'}state.communications.lastChoice=choice;commit('Transmission sent. Command report and threat telemetry updated.');return}
    if(['red-alert','yellow-alert','stand-down'].includes(action)){state.alert=action==='red-alert'?'red':action==='yellow-alert'?'yellow':'normal';commit(`Captain orders: ${state.alert==='normal'?'stand down':state.alert.toUpperCase()+' ALERT'}.`);return}
    if(action==='lower-shields'){state.shieldBackup=clone(state.shields);SHIELD_ARCS.forEach(k=>state.shields[k]=8);state.shieldsLowered=true;commit('Shield grid lowered. Matterlink now has a clear path.');return}
    if(action==='raise-shields'){if(state.shieldBackup)state.shields=clone(state.shieldBackup);state.shieldsLowered=false;state.shieldBackup=null;commit('Deflector shields restored to their previous strength.');return}
    if(action==='lock'){state.security.locks=true;commit(`Matterlink lock authorised for ${state.security.destination}.`);return}
    if(action==='deploy'){if(!state.security.locks){toast('Authorise matterlink lock first.',true);return}if(!state.shieldsLowered){toast('Lower the shields before transporting.',true);return}if(state.security.awayTeam){toast('One team is already deployed.',true);return}state.security.awayTeam=state.security.teamSize;state.security.deployments++;state.security.locks=false;state.missionStage='deployed';commit(`${state.security.awayTeam} personnel transferred to ${state.security.destination}.`);return}
    if(action==='recall'){if(!state.shieldsLowered){toast('Lower shields to recover away personnel.',true);return}state.security.awayTeam=0;state.security.locks=false;state.missionStage=state.science.analysis>=50&&['calm','scan'].includes(state.communications.lastChoice)&&state.security.destination===SECURITY_DESTINATIONS[0]?'complete':'recovered';state.crewHealth=clamp(state.crewHealth+1,0,100);commit(state.missionStage==='complete'?'Mission complete! Telora relay response secured; the away team is safely home.':'Away team safely recovered. Medical checks in progress.');return}
    if(action.startsWith('bias-')){const arc=action.slice(5);if(!SHIELD_ARCS.includes(arc))return;if(state.shieldsLowered){toast('Restore shields before adjusting emitter bias.',true);return}for(const k of SHIELD_ARCS){if(k!==arc)state.shields[k]=clamp(state.shields[k]-7,0,100)}state.shields[arc]=clamp(state.shields[arc]+21,0,100);commit(`Deflector bias transferred towards ${arc.toUpperCase()} shield array.`);return}
    if(action==='preset-explore'){state.power={helm:25,weapons:12,shields:23,science:27,medical:10};commit('Power preset loaded: EXPLORATION.');return}
    if(action==='preset-battle'){state.power={helm:10,weapons:42,shields:35,science:5,medical:5};state.alert='red';commit('Power preset loaded: BATTLE STATIONS.');return}
    if(action==='preset-medical'){state.power={helm:10,weapons:12,shields:20,science:13,medical:40};commit('Power preset loaded: EMERGENCY MEDICAL.');return}
    if(action==='preset-balanced'){state.power=clone(INITIAL.power);commit('Power preset loaded: BALANCED.');return}
    if(action==='repair-hull'){if(state.power.helm<12){toast('Engineering requires at least 12 helm power units for structural repairs.',true);return}if(state.hull===100){toast('Hull integrity is already at maximum.');return}state.hull=clamp(state.hull+12,0,100);commit(`Hull plating restored to ${state.hull}%.`);return}
    if(action==='recharge-shields'){if(state.power.shields<15){toast('Insufficient shield-array power to recharge.',true);return}if(state.shieldsLowered){toast('Raise shields before recharging.',true);return}SHIELD_ARCS.forEach(k=>state.shields[k]=clamp(state.shields[k]+12,0,100));commit('Deflector batteries recharged (+12% to each arc).');return}
    if(action==='diagnostics'){commit(`Crew bioscan complete: ${state.crewInjured} require monitoring. Overall health ${state.crewHealth}%.`);return}
    if(action==='heal'){const i=Number(button.dataset.index),p=state.medical.roster[i];if(!p)return;if(state.power.medical<12){toast('Reroute at least 12 power units to Medical.',true);return}if(state.medical.supplies<=0){toast('Medical supplies exhausted.',true);return}if(p.hp>=100)return;p.hp=clamp(p.hp+25,0,100);state.medical.supplies--;state.crewHealth=clamp(state.crewHealth+3,0,100);state.crewInjured=Math.max(0,state.crewInjured-2);commit(`${p.name} treated successfully. Vital signs now ${p.hp}%.`);return}
    if(action==='mass-triage'){if(state.power.medical<12){toast('Reroute at least 12 power units to Medical first.',true);return}if(state.medical.supplies<2){toast('Mass triage requires two medical kits.',true);return}state.medical.supplies-=2;state.medical.roster.forEach(p=>p.hp=clamp(p.hp+12,0,100));state.crewHealth=clamp(state.crewHealth+5,0,100);state.crewInjured=Math.max(0,state.crewInjured-4);commit('Mass triage complete. Crew health improved across all decks.');return}
  }
  document.addEventListener('keydown',event=>{if(event.key==='Escape')document.body.classList.remove('hud-open')});
  document.addEventListener('click',event=>{
    const planet=event.target.closest('[data-planet]');if(planet){state.galaxy.selectedPlanet=Number(planet.dataset.planet);save();renderMain();return}const route=event.target.closest('[data-route]');if(route){state.galaxy.selected=route.dataset.route;state.galaxy.selectedPlanet=0;save();renderMain();return}
    const screenButton=event.target.closest('[data-screen]');if(screenButton){bridgeMode=screenButton.dataset.screen;renderMain();return}
    const nav=event.target.closest('[data-nav]');if(nav){setStation(nav.dataset.nav);return}
    const action=event.target.closest('[data-action]');if(action){handleAction(action.dataset.action,action);return}
  });
  document.addEventListener('input',event=>{
    const t=event.target;
    if(t.dataset.powerRange){changePower(t.dataset.powerRange,Number(t.value));return}
    if(t.id==='warp-slider'){const out=document.getElementById('warp-readout');if(out)out.textContent=Number(t.value).toFixed(1)}
    if(t.id==='frequency-slider'){const val=document.getElementById('frequency-value');if(val)val.textContent=Number(t.value).toFixed(1)+' MHz';state.communications.frequency=Number(t.value);save()}
    if(t.id==='team-slider'){const val=document.getElementById('team-count');if(val)val.textContent=t.value+' CREW';state.security.teamSize=Number(t.value);save()}
  });
  document.addEventListener('change',event=>{
    if(event.target.dataset.powerRange){const key=event.target.dataset.powerRange;log(`${POWER_LABELS[key]} allocation changed to ${state.power[key]} units.`);save();renderMain();toast('Ship power distribution updated across all stations.');}
    if(event.target.id==='security-destination'){state.security.destination=event.target.value;state.security.locks=false;save()}
  });
  document.getElementById('save-file-input').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const item=JSON.parse(await file.text());if(item.schema!=='VEYRION_MASTER_V1'||!item.state?.power||!item.state?.galaxy||!item.state?.medical)throw Error('Incompatible save file');Object.keys(state).forEach(k=>delete state[k]);Object.assign(state,item.state);for(const [k,v] of Object.entries(DEFAULT_GALAXY))if(state.galaxy[k]===undefined)state.galaxy[k]=clone(v);ensureTactical();save();activeStation='bridge';renderHeader();renderHud();renderMain();toast('Save restored successfully.')}catch(err){toast('Cannot load save: '+err.message,true)}finally{e.target.value=''}});
  document.getElementById('reset-button').addEventListener('click',()=>{
    if(!confirm('Restart the full Veyrion Command game? This resets your saved ship and galaxy. Export a save first if needed.'))return;
    Object.keys(state).forEach(key=>delete state[key]);Object.assign(state,clone(INITIAL));state.galaxy=clone(DEFAULT_GALAXY);state.galaxy.contact=fleetHex(systemHex(HOME.q,HOME.r));state.galaxy.tactical={...clone(TACTICAL_DEFAULT),sector:keyHex(HOME.q,HOME.r)};state.location='Telora orbit · Edris system';state.inOrbit=true;save();activeStation='bridge';renderHeader();renderHud();renderMain();toast('Ship systems reset. New mission initiated.');
  });
  // Low-cost reactor tick: weapon charge restores gradually if enough power is allocated.
  // Renders telemetry only, preserving keyboard focus, range-slider drag, and typed input.
  setInterval(()=>{
    if(state.phaserCharge<100&&state.power.weapons>=12){state.phaserCharge=clamp(state.phaserCharge+3,0,100);save();renderHud();if(activeStation==='weapons'){const label=document.querySelector('.data-pair:nth-child(2) strong');if(label)label.textContent=state.phaserCharge+'%';}}
  },3500);
  // Real-time battle logic advances even when another bridge station is open.
  // Simulation is paused when the tab is hidden so players cannot lose the ship while away.
  setInterval(()=>{if(!document.hidden)combatTick()},1000);
  renderHeader();renderHud();renderMain();
})();

</script>
